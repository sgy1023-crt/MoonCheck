name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Toolchain version
        run: moon version

      - name: Check formatting
        run: moon fmt --check

      - name: Type check the library
        run: moon check

      - name: Type check the native CLI
        run: moon check --target native

      - name: Run the test suite
        run: moon test

      - name: Run the demo
        run: moon run examples/demo
